services:
  fastapi:
    image: catalcysm-fastapi:demo
    build: .
    container_name: fastapi
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://cataclysm:${POSTGRES_PASSWORD:?set in .env}@db:5432/cataclysm
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_TOPIC: crisis-events
      KAFKA_DLQ_TOPIC: crisis-events-dlq
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      INGESTION_API_URL: http://127.0.0.1:8000/events
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  db:
    image: postgres:15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    container_name: db
    environment:
      POSTGRES_USER: cataclysm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: cataclysm
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataclysm -d cataclysm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  broker:
    image: apache/kafka:4.3.1
    volumes:
      - kafka-data:/var/lib/kafka/data
    container_name: broker
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  consumer:
    image: catalcysm-fastapi:demo
    restart: on-failure
    build: .
    container_name: consumer
    command: python src/kafka/consumer.py
    environment:
      DATABASE_URL: postgresql://cataclysm:${POSTGRES_PASSWORD:?set in .env}@db:5432/cataclysm
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_TOPIC: crisis-events
      KAFKA_DLQ_TOPIC: crisis-events-dlq
      KAFKA_GROUP_ID: crisis-dashboard-group
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    user: root
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/opt/spark/app

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    hostname: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1
      --memory 1G
      --webui-port 8081
      spark://spark-master:7077
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - .:/opt/spark/app
      - spark-checkpoints:/tmp/checkpoints

  minio:
    image: cataclysm-minio:source-2025-10-15
    build:
      context: ./infra/minio
    container_name: minio
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    command: server /data --console-address ":9001"

  minio-init:
    image: catalcysm-fastapi:demo
    build: .
    container_name: minio-init
    depends_on:
      - minio
    command: python -m src.storage.init_buckets
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}

  spark-streaming:
    restart: unless-stopped
    image: apache/spark:3.5.1
    container_name: spark-streaming
    user: root
    depends_on:
      broker: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      spark-master: {condition: service_started}
    environment:
      SPARK_LOCAL_HOSTNAME: spark-streaming
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      SPARK_MASTER_URL: spark://spark-master:7077
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
    command: >
      /opt/spark/bin/spark-submit --master spark://spark-master:7077
      --driver-memory 1536m
      --conf spark.driver.host=spark-streaming --conf spark.driver.bindAddress=0.0.0.0
      --conf spark.executor.memory=512m --conf spark.cores.max=1
      --conf spark.jars.ivy=/tmp/ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.hadoop:hadoop-aws:3.3.4
      /opt/spark/app/src/spark/streaming_job.py
    volumes:
      - .:/opt/spark/app
      - spark-checkpoints:/tmp/checkpoints
      - spark-ivy:/tmp/ivy

  prometheus:
    image: prom/prometheus:v3.0.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  exporter:
    image: catalcysm-fastapi:demo
    build: .
    command: python -m src.common.exporter
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://cataclysm:${POSTGRES_PASSWORD:?set in .env}@db:5432/cataclysm
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_GROUP_ID: crisis-dashboard-group
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes: [.:/app]

  anomaly-worker:
    image: catalcysm-fastapi:demo
    build: .
    command: python -m src.ml.detect_anomalies --interval 300
    restart: on-failure
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://cataclysm:${POSTGRES_PASSWORD:?set in .env}@db:5432/cataclysm
    volumes: [.:/app]

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  spark-checkpoints:
  spark-ivy:
  prometheus-data:
  grafana-data:
