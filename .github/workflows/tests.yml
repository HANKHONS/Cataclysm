name: Offline tests
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt pytest httpx ruff
      - run: python -m ruff check src scripts benchmarks tests --select F
      - run: python -m pytest tests -q
